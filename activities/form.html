<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head> 
<body>
<header>
    <h1>Rexzina's Web Design Site</h1>
</header>
<main>
    <form action="processing.html" method="post" id="myForm">
        <fieldset>
            <legend>Sign Up Information</legend>
            <div class="form-row">
                <label for="firstnameInput">First Name:</label>
                <input type="text" name="firstname" id="firstnameInput" placeholder="firstname">
            </div>
            <div class="form-row">
                <label for="emailInput">Email:</label>
                <input type="email" name="email" id="emailInput" placeholder="email">
            </div>
            <div class="form-row">
                <label for="passwordInput">Password:</label>
                <input type="password" name="password" id="passwordInput" placeholder="password">
            </div>
            <div class="form-row">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob"><br>
                Age: <input type="number" name="age" id="age"><br>
            </div>
            <div class="check-row">
                <div class="spacer">Gender:</div>
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
            </div>
            <div class="check-row">
                <div class="spacer"></div>
                <label><input type="checkbox" name="remember"> Remember me</label>
            </div>
            <div class="form-row">
                <label for="state">State:</label>
                <select name="state" id="state">
                    <option value="CA">California</option>
                    <option value="HI">Hawaii</option>
                    <option value="UT">Utah</option>
                </select>
            </div>
            <div class="form-row">
                <label for="comments">Comments:</label>
                <textarea name="comments" id="comments"></textarea>
            </div>
            <div class="form-row">
                <div class="spacer"></div>
                <input type="submit" value="Sign up">
                <h2>Questions:</h2>
                <p>1. JavaScript is a programming language used to make websites interactive. </p>
                <p>2. We can run JavaScript in a browser or on a server</p>
                <p></p>
            </div>
        </fieldset>
    </form>
</main>
<footer>
    <p>&copy; 2026 Rexzina</p>
</footer>
<script>
    document.getElementById("myForm").addEventListener("submit",function(event){
        event.preventDefault();
        const first = document.getElementById("firstname").value;
        const last = document.getElementById("lastname").value;
        const age = document.getElementById("age".value);

        if (!first || !last){
            alert("Please provide your full name.");
            return;
        }

        if (!age || age < 18){
            alert("You must 18 years or older to submit this form.");
            return;
        }

        const data = {
            firstname: first,
            lastname: last,
            age: age
        }
        console.log(data);
        const alr = new 
        alr.age("GET", submit.java, true);
    });
</script>
</body>
</html>
