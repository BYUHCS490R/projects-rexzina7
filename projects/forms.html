<main>
  <h2>Tell us your Favorite Place</h2>

  <form id="travelForm">
    <input type="text" placeholder="Name" required><br><br>
    <input type="number" placeholder="Age"><br><br>
    <input type="text" placeholder="Favorite City"><br><br>
    <textarea placeholder="Comment"></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

  <p id="msg"></p>
</main>

<script>
document.getElementById("travelForm").onsubmit = function(e){
  e.preventDefault();
  document.getElementById("msg").innerText = "Form submitted successfully!";
  this.reset();
}
</script>
